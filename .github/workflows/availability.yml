name: Update availability

# Manual switch for the "open to work" pill in the site header.
# Run it from the Actions tab (or the GitHub mobile app) and pick a status.
on:
  workflow_dispatch:
    inputs:
      status:
        description: "Availability shown in the site header"
        required: true
        type: choice
        options:
          - closed
          - open
        default: closed

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write data/status.json
        run: |
          printf '{\n  "status": "%s"\n}\n' "${{ inputs.status }}" > data/status.json
          cat data/status.json

      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "Status already set to ${{ inputs.status }}, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Set availability to ${{ inputs.status }}"
          git push

      - name: Request a GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
